# Python dependencies, installed offline from PyPI wheels. The runtime ships Python 3.13, so
# zeroconf uses its cp313 wheel for each arch. ifaddr and jeepney are pure Python.
name: python3-deps
buildsystem: simple
build-commands:
  - >-
    pip3 install --verbose --exists-action=i --no-index --no-build-isolation
    --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
    zeroconf==0.151.5 ifaddr==0.2.0 jeepney==0.9.0
