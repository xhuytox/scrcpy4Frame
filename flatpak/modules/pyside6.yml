# PySide6 from PyPI's wheels, which carry their own Qt (in site-packages/PySide6/Qt, found through
# RUNPATH). The app must not use the runtime's Qt: PySide6 links Qt's private API, and since Qt 6.10
# each private symbol names the exact Qt patch release (QObjectPrivate(QtPrivate_6_11_2)). A PySide6
# built against org.kde.Platform's Qt, like io.qt.PySide.BaseApp's, stops loading as soon as Flathub
# moves the runtime to the next Qt patch release, and a bundle can't pin a runtime commit (issue #3).
# With the wheels, the runtime only provides non-Qt libraries, whose ABI doesn't change in a branch.
#
# Essentials has QtCore/Gui/Network/Qml/Quick/QuickControls2. Of Addons, only Qt Multimedia's module
# and library are unpacked, for the notification chime. QSoundEffect plays through PulseAudio without a
# backend plugin; the wheel's FFmpeg plugin can't load here anyway (its FFmpeg needs libbz2.so.1.0,
# the runtime only has libbz2.so.1). Keep the three versions equal; unzip fails if a file is gone.
name: pyside6
buildsystem: simple
build-commands:
  - >-
    pip3 install --verbose --no-index --no-build-isolation --find-links="file://${PWD}"
    --prefix=${FLATPAK_DEST} shiboken6==6.11.3 PySide6_Essentials==6.11.3
  - >-
    unzip -o -q pyside6_addons-6.11.3-*.whl -d "$(python3 -c 'import sysconfig;
    print(sysconfig.get_path("platlib", vars={"base": "/app", "platbase": "/app"}))')"
    PySide6/QtMultimedia.abi3.so
    PySide6/Qt/lib/libQt6Multimedia.so.6
  # Developer tools and build-time files, never loaded by the app.
  - >-
    cd "$(python3 -c 'import sysconfig;
    print(sysconfig.get_path("platlib", vars={"base": "/app", "platbase": "/app"}))')/PySide6" &&
    rm -rf assistant designer linguist lrelease lupdate qmlformat qmllint qmlls svgtoqml
    doc glue include lib scripts typesystems
    Qt/libexec Qt/metatypes Qt/translations
    Qt/plugins/designer Qt/plugins/qmllint Qt/plugins/qmltooling Qt/plugins/sqldrivers
    Qt/lib/libQt6Designer.so.6 Qt/lib/libQt6DesignerComponents.so.6 Qt/lib/libQt6Help.so.6
    Qt/lib/libQt6UiTools.so.6 QtDesigner.abi3.so QtHelp.abi3.so QtUiTools.abi3.so &&
    find . -name '*.pyi' -delete
  # Essentials also has plugins and QML plugins for Addons modules that aren't installed (Pdf, 3D,
  # VirtualKeyboard, ...). They would load those modules, and with them more Qt, from the runtime.
  # Then nothing in PySide6 may need a Qt library from outside it, or the issue #3 crash comes back,
  # nor a library that can't be found.
  - >-
    cd "$(python3 -c 'import sysconfig;
    print(sysconfig.get_path("platlib", vars={"base": "/app", "platbase": "/app"}))')/PySide6" &&
    for f in $(find Qt/plugins Qt/qml -name '*.so'); do
    if ldd "$f" 2>/dev/null | grep -qE 'libQt6[^ ]* => (/usr/|not found)'; then echo "removing $f"; rm "$f"; fi;
    done &&
    for f in $(find . -name '*.so*' -type f); do
    if ldd "$f" 2>/dev/null | grep -E 'libQt6[^ ]* => /usr/|not found'; then echo "error: $f"; exit 1; fi;
    done
cleanup:
  # pip's pyside6-* launchers for the tools removed above.
  - /bin
